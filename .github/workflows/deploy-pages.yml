name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build site
        env:
          VITE_SUPABASE_URL: https://oyyuugucxqtenuqbbbur.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95eXV1Z3VjeHF0ZW51cWJiYnVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTU1MzcsImV4cCI6MjA5OTE3MTUzN30.i8B0F_kvW1zyKnd7-KtuLmVZ4UeCzACAt2z1Ee1U3Hg
        run: |
          cd web
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" > .env
          echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" >> .env
          npm ci
          npm run build
          cd ..
          rm -rf ./assets ./index.html
          cp -r web/dist/* ./
          cp web/dist/index.html ./index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
