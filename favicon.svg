<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b6dff"/>
      <stop offset="1" stop-color="#3d9cf0"/>
    </linearGradient>
    <style>
      .r { transform-origin: 18px 32px; animation: r 2.6s ease-out infinite; }
      .r2 { animation-delay: -1.3s; }
      .w { stroke-dasharray: 100; animation: w 2.6s ease-in-out infinite; }
      .d { animation: d 2.6s ease-in-out infinite; }
      .d2 { animation-delay: .2s; } .d3 { animation-delay: .4s; }
      @keyframes r { from { transform: scale(1); opacity: .55; } to { transform: scale(3.6); opacity: 0; } }
      @keyframes w { 0% { stroke-dashoffset: 100; } 55%, 80% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
      @keyframes d { 0%, 40% { opacity: .38; } 50%, 90% { opacity: 1; } 100% { opacity: .38; } }
      @media (prefers-reduced-motion: reduce) { .r, .w, .d { animation: none; } .w { stroke-dashoffset: 0; } .d { opacity: 1; } }
    </style>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
  <circle class="r" cx="18" cy="32" r="6" fill="none" stroke="#fff" stroke-width="2"/>
  <circle class="r r2" cx="18" cy="32" r="6" fill="none" stroke="#fff" stroke-width="2"/>
  <path d="M18 32 C 26 14, 34 50, 47 32" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="4.4" stroke-linecap="round"/>
  <path class="w" d="M18 32 C 26 14, 34 50, 47 32" fill="none" stroke="#fff" stroke-width="4.4" stroke-linecap="round" pathLength="100"/>
  <circle cx="18" cy="32" r="6.6" fill="#fff"/>
  <circle class="d" cx="50" cy="19" r="3.4" fill="#fff"/>
  <circle class="d d2" cx="52" cy="32" r="3.8" fill="#fff"/>
  <circle class="d d3" cx="50" cy="45" r="3.4" fill="#fff"/>
</svg>
