<!doctype html>
<html lang="en" data-theme="agency">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/influenceflow-crm/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/influenceflow-crm/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="b0eIGuJP3EAx3ksgjH0V5omCNa6CdNkxtS87JRgPPWI" />
    <!-- Private CRM: keep it out of search engines, previews and archives. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#24212b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="/influenceflow-crm/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/influenceflow-crm/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="InfluenceFlow" />
    <title>InfluenceFlow · Private</title>
    <script>
      (function () {
        // Anti-clickjacking: Pages can't send X-Frame-Options / frame-ancestors,
        // so a framed copy of the app blanks itself and breaks out instead.
        if (window.top !== window.self) {
          document.documentElement.style.display = 'none'
          try { window.top.location.replace(window.self.location.href) } catch (e) {}
          return
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Private workspace. JavaScript is needed to sign in.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
